<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Real SMS OTP Tester — DigiLocal</title>
  <style>
    :root {
      --primary: #4F46E5;
      --bg: #0F172A;
      --card: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
      --success: #10B981;
      --danger: #EF4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background-color: var(--card);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin-top: 0;
      color: #6366F1;
      font-size: 1.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0F172A;
      border: 1px solid #334155;
      color: #FFF;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
    }
    textarea {
      font-family: monospace;
      font-size: 0.85rem;
      height: 90px;
      resize: vertical;
    }
    button {
      margin-top: 20px;
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #4338CA;
    }
    .status-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      background: #0F172A;
      border: 1px solid #334155;
      font-size: 0.9rem;
      word-break: break-all;
      display: none;
    }
    .status-box.success { border-color: var(--success); color: #34D399; }
    .status-box.error { border-color: var(--danger); color: #F87171; }
    #recaptcha-container { margin-top: 16px; }
  </style>

  <!-- Firebase Web SDK Compat Libraries -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>🔥 Real Firebase SMS OTP Tester</h2>
    <p>Test sending <b>real SMS text messages</b> to your mobile phone via Firebase Web Authentication, then verify the token with your local DigiLocal Node.js backend.</p>

    <label for="firebaseConfig">Firebase Web Config (JSON format)</label>
    <textarea id="firebaseConfig" placeholder='{"apiKey": "AIzaSy...", "authDomain": "your-app.firebaseapp.com", "projectId": "your-app-id"}'>{
  "apiKey": "AIzaSyBbfZPdWOGwHRAN1cNqoW3k-hm9H6czvXs",
  "authDomain": "visitor-log-d3dd2.firebaseapp.com",
  "projectId": "visitor-log-d3dd2",
  "storageBucket": "visitor-log-d3dd2.firebasestorage.app",
  "messagingSenderId": "866177756650",
  "appId": "1:866177756650:web:8b8995179795218e0e5693",
  "measurementId": "G-KDMMY3BQV7"
}</textarea>

    <label for="phoneNumber">Mobile Number (with +91)</label>
    <input type="text" id="phoneNumber" value="+919571240742" placeholder="+919571240742" />

    <div id="recaptcha-container"></div>

    <button id="sendSmsBtn" onclick="sendSms()">📲 Send Real SMS OTP</button>

    <div id="otpSection" style="display: none;">
      <label for="smsOtp">Enter 6-Digit SMS Code Received on Phone</label>
      <input type="text" id="smsOtp" placeholder="123456" maxlength="6" />

      <button id="verifyOtpBtn" onclick="verifyOtp()">✅ Verify & Login to Backend</button>
    </div>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    let confirmationResult = null;

    function showStatus(msg, isSuccess = true) {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      box.className = 'status-box ' + (isSuccess ? 'success' : 'error');
      box.innerHTML = msg;
    }

    function parseConfigString(str) {
      try {
        return JSON.parse(str);
      } catch (_) {
        // Safe regex transformation converting JS object literal key names into valid double-quoted JSON keys without eval()
        const jsonCompliant = str
          .replace(/([{,]\s*)([a-zA-Z0-9_$]+)\s*:/g, '$1"$2":')
          .replace(/'/g, '"');
        return JSON.parse(jsonCompliant);
      }
    }

    async function sendSms() {
      const configStr = document.getElementById('firebaseConfig').value.trim();
      const phone = document.getElementById('phoneNumber').value.trim();

      if (!configStr) {
        showStatus('Please paste your Firebase Web Config in the textarea above.', false);
        return;
      }
      if (!phone.startsWith('+91') || phone.length < 13) {
        showStatus('Please enter a valid mobile number starting with +91 (e.g. +919571240742)', false);
        return;
      }

      let config;
      try {
        config = parseConfigString(configStr);
      } catch (err) {
        showStatus('Invalid Firebase Config format: ' + err.message + '. Please ensure keys are valid JSON.', false);
        return;
      }

      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }

        window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
          'size': 'invisible'
        });

        showStatus('Sending real SMS OTP to ' + phone + ' via Firebase... Please wait.');
        confirmationResult = await firebase.auth().signInWithPhoneNumber(phone, window.recaptchaVerifier);

        showStatus('🎉 Real SMS OTP sent successfully to <b>' + phone + '</b>! Please check your mobile phone messages.', true);
        document.getElementById('otpSection').style.display = 'block';
        document.getElementById('sendSmsBtn').style.display = 'none';
      } catch (err) {
        showStatus('❌ Firebase SMS Error: ' + err.message, false);
      }
    }

    async function verifyOtp() {
      const otp = document.getElementById('smsOtp').value.trim();
      if (!otp || otp.length !== 6) {
        showStatus('Please enter the 6-digit SMS code received on your phone.', false);
        return;
      }

      try {
        showStatus('Verifying SMS code with Firebase...');
        const result = await confirmationResult.confirm(otp);
        const idToken = await result.user.getIdToken();

        showStatus('Firebase Verified! Sending ID Token to Node.js Backend...');

        const backendRes = await fetch('/api/users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idToken, phone: document.getElementById('phoneNumber').value.trim() })
        });

        const resData = await backendRes.json();
        if (backendRes.ok) {
          showStatus('🚀 <b>BACKEND LOGIN SUCCESSFUL!</b><br/><br/><b>JWT Token:</b> ' + resData.accessToken.slice(0, 40) + '...', true);
        } else {
          showStatus('⚠️ Backend Response (' + backendRes.status + '): ' + (resData.error || JSON.stringify(resData)), false);
        }
      } catch (err) {
        showStatus('❌ Verification Failed: ' + err.message, false);
      }
    }
  </script>
</body>
</html>
